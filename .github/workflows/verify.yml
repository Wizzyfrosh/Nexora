name: Verify Nexora
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime gate rejects every known severity; full-tree gate also rejects critical tooling findings.
      # Known unpatched noncritical tooling findings remain visible; see docs/DEPENDENCIES.md.
      - run: npm run audit:production
      - run: npm run audit:critical
      - run: npm run build --workspace @nexora/shared-types
      - run: npm exec --workspace api -- prisma generate --schema prisma/schema.prisma
      - run: npm run build
      - run: npm run test --workspace api -- --runInBand
      # Generate/build first, then prove runtime imports survive a production-only prune.
      - run: npm prune --omit=dev --ignore-scripts --no-audit
      - name: Production API import smoke test (no server or database connection)
        working-directory: apps/api
        run: node -e "const assert = require('node:assert/strict'); assert.equal(require('./package.json').scripts['start:prod'], 'node dist/src/main.js'); assert.ok(require('node:fs').existsSync('dist/src/main.js')); assert.equal(typeof require('@prisma/client').PrismaClient, 'function'); require('./dist/src/app.module.js'); console.log('Production API imports passed')"
  tenant-security-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_security
      SECURITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @nexora/shared-types
      - run: npm exec --workspace api -- prisma generate --schema prisma/schema.prisma
      # Apply the baseline and additive billing migration only to the disposable database.
      - run: npm exec --workspace api -- prisma migrate deploy --schema prisma/schema.prisma
      - run: npm exec --workspace api -- prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run test:security --workspace api
      - run: npm run build --workspace api
      - name: Compiled analytics worker on disposable PostgreSQL
        run: npm run analytics:drain --workspace api
