name: Verify Nexora
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @nexora/shared-types
      - run: npm exec --workspace api -- prisma generate --schema prisma/schema.prisma
      - run: npm run build
      - run: npm run test --workspace api -- --runInBand
