name: Verify Nexora
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @nexora/shared-types
      - run: npm exec --workspace api -- prisma generate --schema prisma/schema.prisma
      - run: npm run build
      - run: npm run test --workspace api -- --runInBand
  tenant-security-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_security
      SECURITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @nexora/shared-types
      - run: npm exec --workspace api -- prisma generate --schema prisma/schema.prisma
      # Schema sync is restricted to the disposable service database in this job.
      - run: npm exec --workspace api -- prisma db push --schema prisma/schema.prisma
      - run: npm run test:security --workspace api
